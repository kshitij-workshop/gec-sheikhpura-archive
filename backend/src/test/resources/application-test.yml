springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  mail:
    host: localhost
    port: 1025

management:
  health:
    mail:
      enabled: false

app:
  cors:
    allowed-origins: http://localhost:5173
  auth:
    jwt:
      secret: test-only-jwt-secret-0123456789abcdef0123456789abcdef
    refresh-token:
      cookie-secure: false
    frontend-base-url: http://localhost:5173
    bootstrap:
      email: ""
      password: ""
    rate-limit:
      login-per-ip: 1000
      login-per-account: 1000
      register-per-ip: 1000
      forgot-password-per-account: 1000
      forgot-password-per-ip: 1000
      reset-password-per-ip: 1000
  upload:
    max-file-size-bytes: 15728640
    max-photos-per-submission: 50
    authorization-ttl: 10m
    authorize-per-user-per-hour: 1000
    authorize-per-ip-per-hour: 1000
    rate-limit-window: 1h
  cloudinary:
    cloud-name: test-cloud
    api-key: test-key
    api-secret: test-secret
    upload-preset: test-preset
    folder: gecs-test
    secure-delivery: true
