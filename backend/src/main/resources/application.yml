spring:
  application:
    name: gecs-archive-api
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  sql:
    init:
      mode: never
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    jwt:
      issuer: ${APP_JWT_ISSUER:https://gecs-archive.example}
      secret: ${APP_JWT_SECRET:}
      access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token:
      idle-ttl: ${APP_REFRESH_TOKEN_IDLE_TTL:7d}
      absolute-ttl: ${APP_REFRESH_TOKEN_ABSOLUTE_TTL:30d}
      cookie-name: ${APP_REFRESH_COOKIE_NAME:gecs_refresh}
      cookie-secure: ${APP_REFRESH_COOKIE_SECURE:true}
    tokens:
      verification-ttl: ${APP_EMAIL_VERIFICATION_TTL:24h}
      password-reset-ttl: ${APP_PASSWORD_RESET_TTL:1h}
    frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
    bootstrap:
      email: ${APP_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
      display-name: ${APP_BOOTSTRAP_SUPER_ADMIN_DISPLAY_NAME:Archive Administrator}
    rate-limit:
      login-per-ip: ${APP_RATE_LIMIT_LOGIN_PER_IP:10}
      login-per-account: ${APP_RATE_LIMIT_LOGIN_PER_ACCOUNT:5}
      login-window: ${APP_RATE_LIMIT_LOGIN_WINDOW:15m}
      register-per-ip: ${APP_RATE_LIMIT_REGISTER_PER_IP:5}
      register-window: ${APP_RATE_LIMIT_REGISTER_WINDOW:1h}
      forgot-password-per-account: ${APP_RATE_LIMIT_FORGOT_PER_ACCOUNT:3}
      forgot-password-per-ip: ${APP_RATE_LIMIT_FORGOT_PER_IP:10}
      forgot-password-window: ${APP_RATE_LIMIT_FORGOT_WINDOW:1h}
      reset-password-per-ip: ${APP_RATE_LIMIT_RESET_PER_IP:5}
      reset-password-window: ${APP_RATE_LIMIT_RESET_WINDOW:1h}
  upload:
    max-file-size-bytes: ${APP_UPLOAD_MAX_FILE_SIZE_BYTES:15728640}
    max-photos-per-submission: ${APP_UPLOAD_MAX_PHOTOS_PER_SUBMISSION:50}
    authorization-ttl: ${APP_UPLOAD_AUTHORIZATION_TTL:10m}
    authorize-per-user-per-hour: ${APP_UPLOAD_AUTHORIZE_PER_USER_PER_HOUR:20}
    authorize-per-ip-per-hour: ${APP_UPLOAD_AUTHORIZE_PER_IP_PER_HOUR:40}
    rate-limit-window: ${APP_UPLOAD_RATE_LIMIT_WINDOW:1h}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    upload-preset: ${CLOUDINARY_UPLOAD_PRESET:}
    folder: ${CLOUDINARY_UPLOAD_FOLDER:gecs-archive}
    secure-delivery: ${CLOUDINARY_SECURE_DELIVERY:true}

logging:
  level:
    root: INFO
