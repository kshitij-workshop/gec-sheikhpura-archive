spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gecs_archive}
    username: ${DB_USERNAME:gecs}
    password: ${DB_PASSWORD:gecs_dev_password}
  jpa:
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.gecarchive: DEBUG
