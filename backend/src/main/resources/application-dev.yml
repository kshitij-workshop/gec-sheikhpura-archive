spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gecs_archive}
    username: ${DB_USERNAME:gecs}
    password: ${DB_PASSWORD:gecs_dev_password}
  jpa:
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    jwt:
      issuer: ${APP_JWT_ISSUER:https://gecs-archive.example}
      secret: ${APP_JWT_SECRET:dev-only-jwt-secret-change-before-production-32-bytes}
    refresh-token:
      cookie-secure: ${APP_REFRESH_COOKIE_SECURE:false}
  cloudinary:
    secure-delivery: ${CLOUDINARY_SECURE_DELIVERY:true}

logging:
  level:
    com.gecarchive: DEBUG
